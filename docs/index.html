<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Destiny 2 Favorites</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>My Destiny 2 Favorites</h1>
    <p class="subtitle">A personal list of favorite weapons and loadouts.</p>

  <main id="app">

  <script src="app.js"></script>
</body>
</html>
